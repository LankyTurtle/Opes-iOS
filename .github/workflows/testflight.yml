name: Deploy to TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight

    env:
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          required_values=(
            APP_BUNDLE_ID
            APP_STORE_APP_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64
            APPLE_TEAM_ID
            BUILD_CERTIFICATE_BASE64
            BUILD_PROVISION_PROFILE_BASE64
            KEYCHAIN_PASSWORD
            P12_PASSWORD
          )

          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name:-}" ]]; then
              echo "Missing TestFlight environment value: ${value_name}" >&2
              exit 1
            fi
          done

          echo "ARCHIVE_PATH=${RUNNER_TEMP}/Opes.xcarchive" >> "${GITHUB_ENV}"
          echo "EXPORT_PATH=${RUNNER_TEMP}/TestFlightExport" >> "${GITHUB_ENV}"
          echo "KEYCHAIN_PATH=${RUNNER_TEMP}/opes-signing.keychain-db" >> "${GITHUB_ENV}"

      - name: Show build tools
        run: |
          sw_vers
          xcodebuild -version

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="${RUNNER_TEMP}/distribution.p12"
          profile_path="${RUNNER_TEMP}/Opes_App_Store.mobileprovision"
          profile_plist_path="${RUNNER_TEMP}/profile.plist"

          echo -n "${BUILD_CERTIFICATE_BASE64}" | base64 --decode -o "${certificate_path}"
          echo -n "${BUILD_PROVISION_PROFILE_BASE64}" | base64 --decode -o "${profile_path}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${certificate_path}" \
            -P "${P12_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}"

          security cms -D -i "${profile_path}" > "${profile_plist_path}"
          profile_uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "${profile_plist_path}")
          profile_name=$(/usr/libexec/PlistBuddy -c "Print :Name" "${profile_plist_path}")
          profile_application_identifier=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "${profile_plist_path}"
          )

          expected_application_identifier="${APPLE_TEAM_ID}.${APP_BUNDLE_ID}"
          if [[ "${profile_application_identifier}" != "${expected_application_identifier}" ]]; then
            echo "Provisioning profile does not match ${APP_BUNDLE_ID}." >&2
            exit 1
          fi

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${profile_path}" \
            "${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

          echo "PROFILE_NAME=${profile_name}" >> "${GITHUB_ENV}"
          echo "PROFILE_UUID=${profile_uuid}" >> "${GITHUB_ENV}"

          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          api_key_directory="${HOME}/.appstoreconnect/private_keys"
          api_key_path="${api_key_directory}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          mkdir -p "${api_key_directory}"
          echo -n "${APP_STORE_CONNECT_PRIVATE_KEY_BASE64}" | \
            base64 --decode -o "${api_key_path}"
          chmod 600 "${api_key_path}"

      - name: Determine build number
        run: |
          set -euo pipefail

          build_date=$(TZ=Australia/Sydney date +%Y%m%d)
          api_key_path="${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          jwt=$(python3 - "${api_key_path}" "${APP_STORE_CONNECT_KEY_ID}" "${APP_STORE_CONNECT_ISSUER_ID}" <<'PY'
          import base64
          import json
          import subprocess
          import sys
          import time

          key_path, key_id, issuer_id = sys.argv[1:]

          def encode(value):
              return base64.urlsafe_b64encode(value).rstrip(b"=")

          header = encode(json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}, separators=(",", ":")).encode())
          payload = encode(json.dumps({"iss": issuer_id, "aud": "appstoreconnect-v1", "exp": int(time.time()) + 1_000}, separators=(",", ":")).encode())
          signing_input = header + b"." + payload
          der_signature = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", key_path],
              input=signing_input,
              check=True,
              capture_output=True,
          ).stdout

          # Convert OpenSSL's ASN.1 DER ECDSA signature to the raw r || s form
          # required by an ES256 JWT.
          if der_signature[0] != 0x30:
              raise ValueError("Unexpected ECDSA signature format")
          offset = 2 + (der_signature[1] & 0x7f if der_signature[1] & 0x80 else 0)
          values = []
          for _ in range(2):
              if der_signature[offset] != 0x02:
                  raise ValueError("Unexpected ECDSA signature integer")
              length = der_signature[offset + 1]
              offset += 2
              values.append(der_signature[offset:offset + length].lstrip(b"\0").rjust(32, b"\0"))
              offset += length

          print((signing_input + b"." + encode(b"".join(values))).decode())
          PY
          )

          app_response=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${jwt}" \
            --get "https://api.appstoreconnect.apple.com/v1/apps" \
            --data-urlencode "filter[bundleId]=${APP_BUNDLE_ID}" \
            --data-urlencode "limit=1")
          app_id=$(jq --raw-output '.data[0].id // empty' <<<"${app_response}")
          if [[ -z "${app_id}" ]]; then
            echo "App Store Connect app not found for ${APP_BUNDLE_ID}." >&2
            exit 1
          fi

          builds_response=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${jwt}" \
            --get "https://api.appstoreconnect.apple.com/v1/builds" \
            --data-urlencode "filter[app]=${app_id}" \
            --data-urlencode "fields[builds]=version" \
            --data-urlencode "sort=-uploadedDate" \
            --data-urlencode "limit=200")
          last_increment=$(jq --raw-output --arg prefix "${build_date}." '
            [.data[].attributes.version
             | select(startswith($prefix))
             | split(".")[1]
             | tonumber]
            | max // 0
          ' <<<"${builds_response}")

          build_number="${build_date}.$((last_increment + 1))"
          echo "BUILD_NUMBER=${build_number}" >> "${GITHUB_ENV}"
          echo "Using build number ${build_number}."

      - name: Create export configuration
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
              <key>method</key>
              <string>app-store-connect</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${APP_BUNDLE_ID}</key>
                  <string>${PROFILE_UUID}</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint "${RUNNER_TEMP}/ExportOptions.plist"

      - name: Archive application
        run: |
          set -euo pipefail
          set -o pipefail

          xcodebuild \
            -project Opes.xcodeproj \
            -scheme Opes \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${APP_BUNDLE_ID}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}" \
            clean archive | tee "${RUNNER_TEMP}/archive.log"

      - name: Export IPA
        run: |
          set -euo pipefail
          set -o pipefail

          xcodebuild \
            -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${EXPORT_PATH}" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            | tee "${RUNNER_TEMP}/export.log"

          ipa_path=$(find "${EXPORT_PATH}" -maxdepth 1 -name "*.ipa" -print -quit)
          if [[ -z "${ipa_path}" ]]; then
            echo "Xcode did not export an IPA." >&2
            exit 1
          fi

          echo "IPA_PATH=${ipa_path}" >> "${GITHUB_ENV}"

      - name: Validate IPA
        run: |
          set -euo pipefail

          xcrun altool \
            --validate-app \
            --file "${IPA_PATH}" \
            --type ios \
            --apiKey "${APP_STORE_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail

          xcrun altool \
            --upload-app \
            --file "${IPA_PATH}" \
            --type ios \
            --apiKey "${APP_STORE_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"

          {
            echo "### TestFlight upload complete"
            echo ""
            echo "- App Store Connect app: ${APP_STORE_APP_ID}"
            echo "- Bundle ID: ${APP_BUNDLE_ID}"
            echo "- Build number: ${GITHUB_RUN_NUMBER}"
            echo ""
            echo "Apple will process the build before it becomes available to testers."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-deployment-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing assets
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          rm -rf "${HOME}/.appstoreconnect/private_keys"
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
